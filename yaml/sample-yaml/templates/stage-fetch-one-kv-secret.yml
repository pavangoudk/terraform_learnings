# Code Generated by Sidekick is for learning and experimentation purposes only.
parameters:
  - name: stageName
    type: string
  - name: environmentName
    type: string
  - name: serviceConnection
    type: string
  - name: keyVaultName
    type: string
  - name: secretName
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageName }}
    jobs:
      - deployment: Deploy_${{ parameters.stageName }}
        displayName: "Deploy (${{
          parameters.environmentName }})"
        environment: ${{ parameters.environmentName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureKeyVault@2
                  displayName: "Fetch 1 secret from Key Vault"
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    KeyVaultName: ${{ parameters.keyVaultName }}
                    SecretsFilter: ${{ parameters.secretName }}
                    RunAsPreJob: true

                # Secret is now available as $(APP_CLIENT_SECRET) if secretName=APP_CLIENT_SECRET
                - script: |
                    echo "Fetched secret: ${{ parameters.secretName }}"
                    echo "Value is masked."
                  displayName: "Use secret"
                  env:
                    APP_CLIENT_SECRET: $(APP_CLIENT_SECRET)
